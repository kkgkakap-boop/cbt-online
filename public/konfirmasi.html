<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfirmasi Ujian</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body class="bg-light p-5">
<div class="container" style="max-width: 500px;">
  <div class="card shadow p-4">
    <h4>Konfirmasi Peserta</h4>
    <div class="form-group"><label>Nama</label><input type="text" id="dispNama" class="form-control" readonly></div>
    <div class="form-group"><label>Kelas</label><input type="text" id="dispKelas" class="form-control" readonly></div>
    <div class="form-group"><label>Mata Pelajaran</label><select id="mapel" class="form-control"><option value="">-- Pilih --</option></select></div>
    <div class="form-group"><label>Token Ujian</label><input type="text" id="input-token" class="form-control"></div>
    <button class="btn btn-primary btn-block" onclick="submitKonfirmasi()">Mulai Ujian</button>
  </div>
</div>
<script>
const dataSiswa = JSON.parse(sessionStorage.getItem("user_siswa"));
$(document).ready(() => {
  if(!dataSiswa) window.location.href = "/index.html";
  $("#dispNama").val(dataSiswa.nama);
  $("#dispKelas").val(dataSiswa.kelas);
  
  fetch(`/api/ujian?action=getActiveMapel&studentId=${dataSiswa.studentId}&kelas=${dataSiswa.kelas}`)
    .then(r => r.json())
    .then(list => {
      let h = '<option value="">-- Pilih Mapel --</option>';
      list.forEach(m => h += `<option value="${m}">${m}</option>`);
      $("#mapel").html(h);
    });
});

function submitKonfirmasi() {
  fetch('/api/ujian?action=checkToken', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ studentId: dataSiswa.studentId, kelas: dataSiswa.kelas, mapel: $("#mapel").val(), token: $("#input-token").val(), nama: dataSiswa.nama })
  }).then(r => r.json()).then(res => {
    if(res.status === "SUCCESS") {
      sessionStorage.setItem("exam_session", JSON.stringify(res.data));
      window.location.href = "/soal.html";
    } else { alert(res.data); }
  });
}
</script>
</body>
</html>
