<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBT Login</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <style>body { background:#e9ecef; padding-top: 100px; }</style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow p-4">
        <h4 class="text-center mb-3"><b>CBT Login</b></h4>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button class="btn btn-primary btn-block" onclick="login()">Login</button>
      </div>
    </div>
  </div>
</div>
<script>
function login() {
  const username = $('#username').val();
  const password = $('#password').val();
  if(!username || !password) return alert("Isi lengkap!");

  // Cek apakah format admin atau siswa
  const isतुAdmin = username.includes('admin'); // atau deteksi role
  const actionType = username.startsWith('admin') ? 'login_admin' : 'login_siswa';

  fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: actionType, username, password })
  })
  .then(r => r.json())
  .then(res => {
    if(res.status === "SUCCESS") {
      if(actionType === 'login_admin') {
        sessionStorage.setItem("admin_session", JSON.stringify(res.data));
        window.location.href = "/admin.html";
      } else {
        sessionStorage.setItem("user_siswa", JSON.stringify(res.data));
        window.location.href = "/konfirmasi.html";
      }
    } else {
      alert(res.data);
    }
  });
}
</script>
</body>
</html>
